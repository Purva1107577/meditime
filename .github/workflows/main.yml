name: Build MedTime APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK
        run: |
          docker pull kivy/buildozer:stable
          docker run --rm \
            -v "${{ github.workspace }}:/home/user/hostcwd" \
            -e ACCEPT_ANDROID_SDK_LICENSE=1 \
            kivy/buildozer:latest \
            android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedTime-APK
          path: bin/*.apk
